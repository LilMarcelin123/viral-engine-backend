spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/viral_engine?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    # SIN valor por defecto: la app no arranca si falta la variable.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo manda el SQL versionado, NUNCA Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 5
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  jwt:
    # SIN valor por defecto a propósito: si falta JWT_SECRET la app no arranca.
    # Genera uno con:  openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    refresh-days: 14
  cors:
    # separadas por coma; en producción se define la URL del frontend
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:Viral Engine <no-reply@dancreative.mx>}
    enabled: ${MAIL_ENABLED:false}
    poll-ms: ${MAIL_POLL_MS:60000}
  front-url: ${FRONT_URL:http://localhost:5173}
  storage:
    path: ${STORAGE_PATH:./uploads}
    public-url: ${STORAGE_PUBLIC_URL:}
  login:
    max-intentos: ${LOGIN_MAX_INTENTOS:5}
    ventana-minutos: ${LOGIN_VENTANA_MIN:5}
  apify:
    # Vacío por defecto: sin token el scrapeo responde 503 en vez de tumbar la
    # aplicación. El resto del sistema funciona sin él.
    token: ${APIFY_TOKEN:}

server:
  port: ${PORT:8080}
  error:
    # el detalle se controla en ApiExceptionHandler; aquí se apaga la fuga
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework   # respeta X-Forwarded-* detrás del proxy de Railway

logging:
  level:
    org.springframework.security: INFO
